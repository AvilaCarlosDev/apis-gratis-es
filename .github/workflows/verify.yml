name: Verify claims

# Contrasta las afirmaciones comprobables del README con las fuentes reales. Usa la red y depende
# de servicios ajenos, por eso no bloquea PR: avisa cuando el README se desactualiza.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
  pull_request:
    paths: ["README.md", "README.en.md", "scripts/verificar.py"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check README claims against public sources
        run: python3 scripts/verificar.py README.md
