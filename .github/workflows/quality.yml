name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: ShellCheck
        run: shellcheck scripts/*.sh tests/*.sh

      - name: Verifier tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Script tests
        run: tests/check-parity.test.sh

      - name: Catalog schema is valid
        run: python3 scripts/catalogo.py validar

      - name: README tables are up to date with data/apis.json
        run: python3 scripts/generar_readme.py --comprobar

      - name: Spanish and English READMEs link the same resources
        run: scripts/check-parity.sh README.md README.en.md

  demos:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Demo tests
        working-directory: demos
        run: npm test

  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan for committed secrets (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  provenance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require the AI-assistance disclosure in both READMEs
        run: |
          grep -Eiq "Claude \(Anthropic\)" README.md || { echo "::error::README.md is missing the AI-assistance disclosure"; exit 1; }
          grep -Eiq "Claude \(Anthropic\)" README.en.md || { echo "::error::README.en.md is missing the AI-assistance disclosure"; exit 1; }
