# Se aceptan 403 y 429: varios proveedores bloquean a los clientes automáticos y eso no
# significa que el enlace esté roto (esos datos se marcan ⚠️ en el README).
accept = [200, 202, 206, 403, 429]
max_retries = 3
retry_wait_time = 5
# Endpoints de API que solo aceptan POST o exigen clave, y direcciones locales.
exclude = [
  '^https://openrouter\.ai/api/v1/chat/completions',
  '^https://openrouter\.ai/api/v1/models',
  '^http://localhost',
]
