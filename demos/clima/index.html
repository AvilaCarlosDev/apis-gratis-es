<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'self' https://api.open-meteo.com https://geocoding-api.open-meteo.com; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <title>Clima de cualquier ciudad</title>
  <meta name="description" content="Demo de apis-gratis-es: el clima de hoy y el pronóstico de siete días de cualquier ciudad, con datos de Open-Meteo.">
  <link rel="stylesheet" href="../compartido/base.css">
  <link rel="stylesheet" href="./estilos.css">
  <script type="module" src="./main.js"></script>
</head>
<body>
  <a class="salto" href="#dias">Ir al pronóstico</a>

  <header class="barra-demo">
    <div class="contenedor barra-demo-fila">
      <span class="sello" aria-hidden="true">{ }</span>
      <div class="barra-demo-titulo">
        <h1>Clima</h1>
        <p class="etiqueta">Demo · Open-Meteo</p>
      </div>
      <p class="volver"><a href="../../">Ver todas las demos</a></p>
    </div>
  </header>

  <main class="contenedor clima">
    <section class="cielo" aria-label="Clima de ahora">
      <div class="buscar" role="search">
        <input id="buscador" type="search" placeholder="Buscar una ciudad" aria-label="Buscar una ciudad" autocomplete="off" maxlength="60" enterkeyhint="search">
        <button id="buscar" type="button" class="primario">Buscar</button>
        <select id="unidad" class="campo" aria-label="Unidad de temperatura">
          <option value="celsius">°C</option>
          <option value="fahrenheit">°F</option>
        </select>
      </div>
      <div id="lugares" class="lugares" role="group" aria-label="Coincidencias"></div>
      <div id="actual" class="actual" aria-live="polite"><span class="esq esq-lugar" aria-hidden="true"></span><span class="esq esq-temp" aria-hidden="true"></span><span class="esq esq-cond" aria-hidden="true"></span></div>
    </section>

    <section class="semana" aria-labelledby="titulo-dias">
      <div id="aviso" class="aviso" hidden></div>
      <h2 id="titulo-dias">Próximos siete días</h2>
      <div id="dias"><span class="esq esq-dia" aria-hidden="true"></span><span class="esq esq-dia" aria-hidden="true"></span><span class="esq esq-dia" aria-hidden="true"></span><span class="esq esq-dia" aria-hidden="true"></span><span class="esq esq-dia" aria-hidden="true"></span><span class="esq esq-dia" aria-hidden="true"></span><span class="esq esq-dia" aria-hidden="true"></span></div>
    </section>
  </main>

  <footer class="contenedor pie">
    <p>Demo del repositorio <a href="https://github.com/AvilaCarlosDev/apis-gratis-es">apis-gratis-es</a>. No guarda nada: ni tu búsqueda ni tu ubicación.</p>
    <p>Datos meteorológicos de <a href="https://open-meteo.com/">Open-Meteo.com</a> (<a href="https://creativecommons.org/licenses/by/4.0/deed.es">CC BY 4.0</a>, solo uso no comercial). Tipografía Bricolage Grotesque (SIL OFL).</p>
  </footer>
</body>
</html>
